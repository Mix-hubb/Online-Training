<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <!-- Mockup banner: a laptop playing a lesson, with a hard hat and a certificate. Subject kept in the middle third. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A7CC6"/>
      <stop offset="1" stop-color="#17599A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>
  <circle cx="800" cy="250" r="230" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- laptop -->
  <rect x="610" y="96" width="380" height="250" rx="10" fill="#14213D"/>
  <rect x="626" y="112" width="348" height="208" rx="4" fill="#DCE8F5"/>
  <rect x="626" y="112" width="348" height="150" fill="#B5D2EE"/>
  <path d="M626 262 L700 200 L760 240 L840 170 L974 262 Z" fill="#7FB0DE"/>
  <circle cx="800" cy="186" r="34" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M790 168 L790 204 L820 186 Z" fill="#1F6FB8"/>
  <rect x="642" y="276" width="316" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="642" y="276" width="190" height="6" rx="3" fill="#1F6FB8"/>
  <circle cx="832" cy="279" r="7" fill="#1F6FB8"/>
  <rect x="642" y="294" width="120" height="8" rx="4" fill="#5B6B7F" fill-opacity="0.5"/>
  <rect x="900" y="292" width="58" height="12" rx="3" fill="#1E8A66"/>
  <path d="M560 346 L1040 346 L1010 376 L590 376 Z" fill="#E6F0FA"/>
  <rect x="760" y="346" width="80" height="8" rx="3" fill="#B5C2D1"/>
  <!-- hard hat -->
  <g transform="translate(450 300)">
    <path d="M0 64 Q0 0 70 0 Q140 0 140 64 Z" fill="#F2B705"/>
    <rect x="-16" y="60" width="172" height="16" rx="8" fill="#D99A00"/>
    <rect x="60" y="4" width="20" height="56" rx="6" fill="#D99A00"/>
    <circle cx="70" cy="34" r="12" fill="#FFF4CC"/>
  </g>
  <!-- certificate -->
  <g transform="translate(1060 150) rotate(6)">
    <rect width="150" height="200" rx="6" fill="#FFFFFF"/>
    <rect x="18" y="24" width="114" height="10" rx="5" fill="#1F6FB8"/>
    <rect x="30" y="50" width="90" height="6" rx="3" fill="#B5C2D1"/>
    <rect x="30" y="64" width="70" height="6" rx="3" fill="#B5C2D1"/>
    <rect x="24" y="90" width="102" height="6" rx="3" fill="#DCE8F5"/>
    <rect x="24" y="104" width="102" height="6" rx="3" fill="#DCE8F5"/>
    <circle cx="75" cy="152" r="22" fill="#F2B705"/>
    <circle cx="75" cy="152" r="13" fill="#FFF4CC"/>
    <path d="M62 170 L56 196 L70 188 L75 200 L80 188 L94 196 L88 170 Z" fill="#D99A00"/>
  </g>
  <!-- check badge -->
  <g transform="translate(980 96)">
    <circle r="26" fill="#1E8A66"/>
    <path d="M-11 0 L-3 9 L12 -8" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
